stages:
  - train

train-model:
  stage: train
  image: amazon/aws-cli:2.15.0
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
  script:
    - aws --version
    - echo "Запуск AWS Step Function для тренування моделі..."
    - EXECUTION_NAME="train-${CI_COMMIT_SHORT_SHA}-$(date +%s)"
    - INPUT_JSON=$(printf '{"source":"gitlab-ci","commit":"%s","gitlab_job_id":"%s"}' "$CI_COMMIT_SHORT_SHA" "$CI_JOB_ID")
    - aws stepfunctions start-execution --state-machine-arn "$STATE_MACHINE_ARN" --name "$EXECUTION_NAME" --input "$INPUT_JSON"
