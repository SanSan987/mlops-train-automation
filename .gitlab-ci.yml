# Визначення етапів
stages:
  - train

# Job для запуску Step Function
train-model:
  # Етап, на якому виконується job
  stage: train
  
  # Використання офіційного образу AWS CLI
  image: 
    name: amazon/aws-cli:2.15.0
    entrypoint: [""] # Скидаємо стандартну точку входу образу
  
  # Запуск тільки при push у гілку lesson-10
  only:
    - lesson-10
  
  # Головний скрипт
  script:
    - echo "Запуск AWS Step Function для тренування моделі..."
    
    # Використання змінних CI/CD для передачі інформації
    - STEP_FUNCTION_ARN="${SFN_ARN}" 
    - EXECUTION_NAME="train-$(date +%Y%m%d-%H%M%S)-${CI_COMMIT_SHORT_SHA}"
    - INPUT_JSON='{"source": "gitlab-ci", "commit": "'${CI_COMMIT_SHORT_SHA}'", "gitlab_job_id": "'${CI_JOB_ID}'"}'
    
    # Виклик AWS CLI команди
    - aws stepfunctions start-execution \
      --state-machine-arn "${STEP_FUNCTION_ARN}" \
      --name "${EXECUTION_NAME}" \
      --input "${INPUT_JSON}"
      
    - echo "Step Function ${EXECUTION_NAME} успішно запущена!"